<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Gardrobe — Style and organise your clothes</title>
<meta name="description" content="My Gardrobe — style and organise your clothes online.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..900&amp;family=Dancing+Script:wght@700&amp;display=swap">
<style>
body{margin:0;background:#F6F2EA}
a{color:#2B2B2B}a:hover{color:#8B7D6B}
*{box-sizing:border-box}
@keyframes grRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes grFade{from{opacity:0}to{opacity:1}}
@keyframes grOut{from{opacity:1}to{opacity:0}}
.gr-r0{animation:grFade .9s both}
.gr-r1{animation:grRise .9s .15s ease-out both}
.gr-r2{animation:grRise .9s .3s ease-out both}
.gr-r3{animation:grRise .9s .45s ease-out both}
.gr-r4{animation:grRise 1s .35s ease-out both}
.gr-cta{transition:background .2s,transform .2s;cursor:pointer}
.gr-cta:hover{background:#444444 !important;transform:translateY(-1px)}
.gr-ghost{transition:background .2s,border-color .2s;cursor:pointer}
.gr-ghost:hover{background:#FFFDF8 !important;border-color:#2B2B2B !important}
.gr-cta:focus-visible,.gr-ghost:focus-visible,.gr-lang:focus-visible{outline:2px solid #444444;outline-offset:3px}
.gr-lang{cursor:pointer;transition:color .2s}
.gr-lang:hover{color:#8B7D6B !important}
.gr-langopt:hover{background:#F6F2EA !important}
.gr-langopt:focus-visible{outline:2px solid #444444;outline-offset:-2px}
.gr-card{transition:transform .25s,border-color .25s}
.gr-card:hover{transform:translateY(-4px);border-color:#B5A898 !important}
/* Welcome: letters pop in one by one; hover or touch makes them bolder with white glints */
.gr-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@keyframes grPop{0%{opacity:0;transform:translateY(.7em) scale(.4)}55%{opacity:1;transform:translateY(-.22em) scale(1.12)}78%{transform:translateY(.05em) scale(.97)}100%{opacity:1;transform:none}}
@keyframes grGlint{0%{background-position:120% 0}60%,100%{background-position:-20% 0}}
@keyframes grTwinkle{0%,100%{opacity:0;transform:scale(.2) rotate(0)}45%{opacity:1;transform:scale(1) rotate(45deg)}70%{opacity:.25;transform:scale(.5) rotate(70deg)}}
.gr-greet{cursor:default;user-select:none;-webkit-tap-highlight-color:transparent}
.gr-lt{display:inline-block;white-space:pre;animation:grPop .7s cubic-bezier(.3,1.5,.5,1) both}
.gr-lt-done{animation:none}
.gr-lt-in{position:relative;display:inline-block;font-weight:700;transition:font-weight .35s ease,transform .35s ease}
.gr-lt-in::before,.gr-lt-in::after{content:'';position:absolute;pointer-events:none;background:#FFFFFF;opacity:0;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);filter:drop-shadow(0 0 1px rgba(176,141,87,.9))}
.gr-lt-in::after{width:.42em;height:.42em;top:12%;left:18%}
.gr-lt-in::before{width:.26em;height:.26em;top:58%;left:52%}
.gr-lt:nth-child(3n+2) .gr-lt-in::after{top:44%;left:-4%}
.gr-lt:nth-child(3n+2) .gr-lt-in::before{top:8%;left:62%}
.gr-lt:nth-child(3n) .gr-lt-in::after{top:-6%;left:48%}
.gr-lt:nth-child(3n) .gr-lt-in::before{top:64%;left:6%}
.gr-greet:hover .gr-lt-in,.gr-greet.gr-shine .gr-lt-in{font-weight:900;transform:translateY(-1px);color:transparent;background-image:linear-gradient(105deg,#141414 0 42%,#8A8378 46%,#FFFFFF 49%,#FFF6DF 50%,#FFFFFF 51%,#8A8378 54%,#141414 58% 100%);filter:drop-shadow(0 0 .6px rgba(20,20,20,.75));background-size:320% 100%;-webkit-background-clip:text;background-clip:text;animation:grGlint 1.9s calc(var(--i) * .09s) ease-in-out infinite}
.gr-greet:hover .gr-lt-in::after,.gr-greet.gr-shine .gr-lt-in::after{animation:grTwinkle 1.5s calc(var(--i) * .23s) ease-in-out infinite}
.gr-greet:hover .gr-lt-in::before,.gr-greet.gr-shine .gr-lt-in::before{animation:grTwinkle 1.5s calc(var(--i) * .23s + .7s) ease-in-out infinite}
/* Hanger swing */
@keyframes grSwing{0%{transform:rotate(0)}14%{transform:rotate(7deg)}31%{transform:rotate(-5deg)}49%{transform:rotate(3.2deg)}67%{transform:rotate(-1.7deg)}84%{transform:rotate(.6deg)}100%{transform:rotate(0)}}
.gr-hang{display:inline-block;transform-origin:50.7% 5.8%;animation:grSwing 2.6s .6s ease-in-out both}
.gr-hang>svg{display:block;transform-origin:50.7% 5.8%;cursor:pointer}
.gr-hang>svg.gr-swing{animation:grSwing 1.9s ease-in-out}
/* Reveal on scroll */
.gr-js .gr-reveal{opacity:0;transform:translateY(28px);transition:opacity .8s ease-out,transform .8s cubic-bezier(.2,.7,.2,1)}
.gr-js .gr-reveal.gr-in,.gr-js .gr-reveal.gr-seen{opacity:1;transform:none}
.gr-js .gr-reveal.gr-seen{transition:none}
.gr-stagger>.gr-reveal:nth-child(2){transition-delay:.12s}
.gr-stagger>.gr-reveal:nth-child(3){transition-delay:.24s}
/* Walk-in sequence */
@keyframes grDoorL{0%{transform:rotateY(0)}100%{transform:rotateY(-105deg)}}
@keyframes grDoorR{0%{transform:rotateY(0)}100%{transform:rotateY(105deg)}}
@keyframes grDolly{from{transform:scale(1)}to{transform:scale(3.6)}}
.gr-stage{animation:grFade .4s both}
.gr-door-l{transform-origin:left center;animation:grDoorL 1.4s .45s cubic-bezier(.65,0,.25,1) both;backface-visibility:hidden}
.gr-door-r{transform-origin:right center;animation:grDoorR 1.4s .45s cubic-bezier(.65,0,.25,1) both;backface-visibility:hidden}
.gr-front{animation:grOut .5s 1.75s both}
.gr-dolly{transform-origin:50% 50%;animation:grDolly 2.4s 1.6s cubic-bezier(.45,0,.3,1) both}
.gr-bdoor-l{transform-origin:left center;animation:grDoorL 1.1s 3.75s cubic-bezier(.65,0,.25,1) both;backface-visibility:hidden}
.gr-bdoor-r{transform-origin:right center;animation:grDoorR 1.1s 3.75s cubic-bezier(.65,0,.25,1) both;backface-visibility:hidden}
.gr-flash{animation:grFade .6s 3.7s both}
.gr-in-s{animation:grRise .8s ease-out backwards}
.gr-in-1{animation-delay:.15s}.gr-in-2{animation-delay:.4s}.gr-in-3{animation-delay:.7s}.gr-in-4{animation-delay:.85s}.gr-in-5{animation-delay:1.15s}
@media (prefers-reduced-motion: reduce){
.gr-r0,.gr-r1,.gr-r2,.gr-r3,.gr-r4{animation:none}
.gr-lt,.gr-greet:hover .gr-lt-in,.gr-greet.gr-shine .gr-lt-in{animation:none}
.gr-greet:hover .gr-lt-in::before,.gr-greet:hover .gr-lt-in::after,.gr-greet.gr-shine .gr-lt-in::before,.gr-greet.gr-shine .gr-lt-in::after{animation:none;opacity:.9;transform:none}
.gr-hang,.gr-hang>svg,.gr-hang>svg.gr-swing,.gr-in-s{animation:none}
.gr-js .gr-reveal{opacity:1;transform:none;transition:none}
.gr-door-l,.gr-door-r,.gr-bdoor-l,.gr-bdoor-r{animation-duration:.4s}
.gr-dolly{animation-duration:.6s}
}
</style>
</head>
<body>
<template id="gr-template">
<div dir="{{dir}}" style="font-family: 'Archivo', 'Helvetica Neue', sans-serif; font-weight: 400; font-size: 17px; line-height: 1.55; color: #2B2B2B; background: #F6F2EA; min-height: 100vh">

<!-- HEADER -->
<header style="position: absolute; top: 0; left: 0; right: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 20px clamp(20px, 5vw, 72px)">
<div class="gr-greet" onTouchstart="{{shine}}" style="font-size: clamp(20px, 2.2vw, 28px); font-weight: 700; letter-spacing: .24em; margin-right: -.24em; text-transform: uppercase; color: #2B2B2B; white-space: nowrap"><span class="gr-sr">{{t.greeting}}</span><span aria-hidden="true"><sc-for list="{{greet}}" as="g" hint-placeholder-count="7"><span class="{{g.cls}}" style="animation-delay: {{g.d}}s; --i: {{g.i}}"><span class="gr-lt-in">{{g.ch}}</span></span></sc-for></span></div>
<nav aria-label="Language" style="position: relative; justify-self: end">
<button class="gr-lang" onClick="{{toggleMenu}}" aria-haspopup="true" aria-expanded="{{menuOpen}}" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; min-height: 52px; padding: 4px; background: transparent; border: 0; color: #2B2B2B; font-family: 'Archivo', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase">
<span style="display: flex; align-items: center; gap: 6px"><span style="font-size: 20px; line-height: 1; letter-spacing: 0">{{current.flag}}</span></span>
<span>Language</span>
</button>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; right: 0; top: calc(100% + 8px); width: min(360px, 90vw); padding: 10px; background: #FFFDF8; border: 1px solid #DDD5C8; border-radius: 16px; box-shadow: 0 24px 48px -16px rgba(43,43,43,.3); z-index: 20; display: flex; flex-direction: column; gap: 8px">
<label style="display: flex; align-items: center; gap: 8px; padding: 0 12px; min-height: 46px; border: 1px solid #DDD5C8; border-radius: 12px; background: #F6F2EA">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#6A635A" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></g></svg>
<input type="search" value="{{q}}" onChange="{{onQ}}" placeholder="{{searchPh}}" aria-label="{{searchPh}}" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-family: 'Archivo', sans-serif; font-size: 16px; color: #2B2B2B">
</label>
<div style="padding: 0 6px; font-size: 13px; color: #6A635A">{{langCountLabel}}</div>
<ul style="margin: 0; padding: 0; list-style: none; max-height: min(420px, 58vh); overflow-y: auto; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{langs}}" as="l" hint-placeholder-count="8">
<li>
<sc-if value="{{l.active}}" hint-placeholder-val="{{false}}">
<button class="gr-langopt" aria-current="true" onClick="{{l.pick}}" style="width: 100%; min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 6px 12px; background: #E6DFD4; border: 0; border-radius: 10px; color: #2B2B2B; font-family: 'Archivo', sans-serif; text-align: left; cursor: pointer"><span style="font-size: 22px; line-height: 1; width: 28px; text-align: center">{{l.flag}}</span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 700">{{l.native}}</span><span style="font-size: 12px; color: #6A635A">{{l.english}}</span></span><span style="font-size: 18px; font-weight: 700">✓</span></button>
</sc-if>
<sc-if value="{{l.inactive}}" hint-placeholder-val="{{true}}">
<button class="gr-langopt" onClick="{{l.pick}}" style="width: 100%; min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 6px 12px; background: transparent; border: 0; border-radius: 10px; color: #2B2B2B; font-family: 'Archivo', sans-serif; text-align: left; cursor: pointer"><span style="font-size: 22px; line-height: 1; width: 28px; text-align: center">{{l.flag}}</span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 600">{{l.native}}</span><span style="font-size: 12px; color: #6A635A">{{l.english}}</span></span></button>
</sc-if>
</li>
</sc-for>
</ul>
</div>
</sc-if>
</nav>
</header>

<!-- HERO -->
<section style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 48px; padding: 96px clamp(20px, 5vw, 72px) 72px">
<!-- welcome + logo, centred -->
<div class="gr-r0" style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px">
<span class="gr-hang"><svg width="340" height="142" viewBox="0 0 240 100" role="img" aria-label="My Gardrobe" style="max-width: 82vw; height: auto"><g fill="none" stroke="#111111" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"><path d="M120 34v-6c0-3.4 2.4-5.2 5.2-6.6 2.8-1.4 5-3.6 5-7.4 0-4.8-3.8-8.2-8.6-8.2-4.4 0-7.8 2.8-8.6 6.6"></path><path d="M120 34C92 44 54 57 30 65.5c-9 3.2-11 10.6-3.4 14.5"></path><path d="M120 34c28 10 66 23 90 31.5 9 3.2 11 10.6 3.4 14.5"></path></g><g fill="none" stroke="#8E857A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M120 34v-6c0-3.4 2.4-5.2 5.2-6.6 2.8-1.4 5-3.6 5-7.4 0-4.8-3.8-8.2-8.6-8.2-4.4 0-7.8 2.8-8.6 6.6"></path><path d="M120 34C92 44 54 57 30 65.5c-9 3.2-11 10.6-3.4 14.5"></path><path d="M120 34c28 10 66 23 90 31.5 9 3.2 11 10.6 3.4 14.5"></path></g><text x="120" y="88" text-anchor="middle" textLength="166" lengthAdjust="spacingAndGlyphs" font-family="'Dancing Script', cursive" font-weight="700" font-size="31" fill="#8E857A" stroke="#111111" stroke-width=".7">My Gardrobe</text></svg></span>
<h1 class="gr-r1" style="margin: 6px 0 0; max-width: min(92vw, 18em); font-size: clamp(26px, calc(3.6vw + 10px), 56px); line-height: 1.08; font-weight: 800; letter-spacing: -.02em; text-wrap: balance; color: #2B2B2B">Style and organise your clothes</h1>
</div>
<div class="gr-r3" style="display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 420px">
<button class="gr-cta" onClick="{{start}}" style="width: 100%; min-height: 60px; padding: 0 32px; background: #2B2B2B; color: #F6F2EA; border: 0; border-radius: 999px; font-family: 'Archivo', sans-serif; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px">
<span>{{t.start}}</span>
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
</div>

</section>

<!-- HOW IT WORKS -->
<section style="padding: clamp(72px, 9vw, 120px) clamp(20px, 5vw, 72px); border-top: 1px solid #DDD5C8">
<div style="max-width: 1240px; margin: 0 auto">
<h2 class="gr-reveal" style="margin: 0 auto 44px; max-width: 860px; font-size: clamp(32px, 4vw, 52px); font-weight: 800; letter-spacing: -.03em; line-height: 1.05; color: #2B2B2B">{{t.howKicker}}</h2>
<div class="gr-stagger" style="display: grid; grid-template-columns: 1fr; gap: 16px; max-width: 860px; margin: 0 auto">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
<div class="gr-reveal" style="background: #FFFDF8; border: 1px solid #DDD5C8; border-radius: 22px; padding: 22px; display: flex; align-items: center; gap: 16px">
<div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<div style="width: 44px; height: 44px; border-radius: 50%; background: #2B2B2B; color: #F6F2EA; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; margin-bottom: 8px">{{s.n}}</div>
<h3 style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -.02em; color: #2B2B2B">{{s.title}}</h3>
<p style="margin: 0; font-size: 16px; color: #6A635A">{{s.text}}</p>
</div>
<img src="{{s.img}}" alt="" style="flex: 0 0 auto; width: 42%; max-width: 150px; height: auto; display: block">
</div>
</sc-for>
</div>
</div>
</section>

<!-- CONTACT -->
<section id="contact" style="padding: clamp(72px, 9vw, 120px) clamp(20px, 5vw, 72px); border-top: 1px solid #DDD5C8">
<div class="gr-reveal" style="max-width: 760px; margin: 0 auto clamp(40px, 5vw, 64px); text-align: center">
<h2 style="margin: 0 0 16px; font-size: clamp(32px, 4vw, 52px); font-weight: 800; letter-spacing: -.03em; line-height: 1.05; color: #2B2B2B">{{t.promoTitle}}</h2>
<p style="margin: 0; font-size: clamp(17px, 1.6vw, 20px); line-height: 1.55; color: #6A635A">{{t.promoText}}</p>
</div>
<div class="gr-reveal" style="max-width: 1240px; margin: 0 auto; background: #2B2B2B; color: #F6F2EA; border-radius: 28px; padding: clamp(28px, 5vw, 56px); display: flex; flex-wrap: wrap; gap: 32px; justify-content: space-between; align-items: center">
<h2 style="margin: 0; font-size: clamp(32px, 4vw, 48px); font-weight: 800; letter-spacing: -.03em; line-height: 1.05; color: #F6F2EA">{{t.contactKicker}}</h2>
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 16px">
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{contacts}}" as="c" hint-placeholder-count="4">
<sc-if value="{{c.open}}" hint-placeholder-val="{{false}}">
<button class="gr-cta" aria-expanded="true" onClick="{{c.toggle}}" style="min-height: 48px; padding: 0 20px; background: #C9BEB0; color: #2B2B2B; border: 0; border-radius: 999px; font-family: 'Archivo', sans-serif; font-size: 16px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px"><img src="{{c.icon}}" alt="" aria-hidden="true" style="width: 20px; height: 20px; display: block"><span>{{c.label}}</span></button>
</sc-if>
<sc-if value="{{c.closed}}" hint-placeholder-val="{{true}}">
<button class="gr-cta" aria-expanded="false" onClick="{{c.toggle}}" style="min-height: 48px; padding: 0 20px; background: #F6F2EA; color: #2B2B2B; border: 0; border-radius: 999px; font-family: 'Archivo', sans-serif; font-size: 16px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px"><img src="{{c.icon}}" alt="" aria-hidden="true" style="width: 20px; height: 20px; display: block"><span>{{c.label}}</span></button>
</sc-if>
</sc-for>
</div>
<sc-if value="{{contactShown}}" hint-placeholder-val="{{false}}">
<a href="{{contactHref}}" target="_blank" rel="noopener" style="font-size: clamp(20px, 2.4vw, 28px); font-weight: 700; color: #F6F2EA; text-decoration: underline; text-underline-offset: 5px">{{contactValue}}</a>
</sc-if>
</div>
</div>
</section>

<footer style="padding: 28px clamp(20px, 5vw, 72px) 40px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; font-size: 14px; color: #7A7166">
<div style="display: flex; align-items: center; gap: 18px; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<svg width="140" height="58" viewBox="0 0 240 100" role="img" aria-label="My Gardrobe"><g fill="none" stroke="#111111" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"><path d="M120 34v-6c0-3.4 2.4-5.2 5.2-6.6 2.8-1.4 5-3.6 5-7.4 0-4.8-3.8-8.2-8.6-8.2-4.4 0-7.8 2.8-8.6 6.6"></path><path d="M120 34C92 44 54 57 30 65.5c-9 3.2-11 10.6-3.4 14.5"></path><path d="M120 34c28 10 66 23 90 31.5 9 3.2 11 10.6 3.4 14.5"></path></g><g fill="none" stroke="#8E857A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M120 34v-6c0-3.4 2.4-5.2 5.2-6.6 2.8-1.4 5-3.6 5-7.4 0-4.8-3.8-8.2-8.6-8.2-4.4 0-7.8 2.8-8.6 6.6"></path><path d="M120 34C92 44 54 57 30 65.5c-9 3.2-11 10.6-3.4 14.5"></path><path d="M120 34c28 10 66 23 90 31.5 9 3.2 11 10.6 3.4 14.5"></path></g><text x="120" y="88" text-anchor="middle" textLength="166" lengthAdjust="spacingAndGlyphs" font-family="'Dancing Script', cursive" font-weight="700" font-size="31" fill="#8E857A" stroke="#111111" stroke-width=".7">My Gardrobe</text></svg>
</div>
<span style="font-style: italic; font-weight: 600; color: #6E6255">Style and organise your clothes.</span>
</div>
<span>{{t.footer}}</span>
<div style="flex-basis: 100%; padding-top: 14px; border-top: 1px solid #E4DED5; text-align: center; font-size: 13px; letter-spacing: .02em">Cynthia Frigula · Jázmin Szalacsi · Adrián Pörsök</div>
</footer>

<!-- WALK-IN SEQUENCE -->
<sc-if value="{{opening}}" hint-placeholder-val="{{false}}">
<div class="gr-stage" role="dialog" aria-label="{{t.start}}" style="position: fixed; inset: 0; z-index: 50; background: #F6F2EA; overflow: hidden">

<div class="gr-dolly" style="position: absolute; inset: 0">
<svg viewBox="{{sceneBox}}" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block">
<defs>
<linearGradient id="grBay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF4DE"></stop><stop offset=".45" stop-color="#F5EDE1"></stop><stop offset="1" stop-color="#E6DDD0"></stop></linearGradient>
