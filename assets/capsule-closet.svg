<path d="M104 106v-4c0-2 2-3 4-2l6 4v2z" fill="#B48C6E"/>
</g>
<!-- sparkles, as on the Colour match card -->
<g fill="none" stroke="#2B2B2B" stroke-width="1.1" stroke-linecap="round">
<path d="M148 30c0 3 3 6 6 6-3 0-6 3-6 6 0-3-3-6-6-6 3 0 6-3 6-6z"/>
<path d="M12 74c0 2 2 4 4 4-2 0-4 2-4 4 0-2-2-4-4-4 2 0 4-2 4-4z"/>
</g>
</svg>
